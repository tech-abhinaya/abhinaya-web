<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abhinaya Store | Fashion Accessories</title>
  <meta name="description" content="Koleksi aksesori pilihan Abhinaya Store.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --deep: #6B4C8A;
      --plum: #4A285F;
      --lav: #A78BFA;
      --soft: #FAF7FC;
      --ink: #382445;
      --line: rgba(107,76,138,0.14);
    }
    * { box-sizing: border-box; }
    body {
      background: var(--soft);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
    }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .nav { background: rgba(74,40,95,.94); backdrop-filter: blur(16px); }
    .hero {
      background: linear-gradient(120deg, #4A285F, #6B4C8A 58%, #A78BFA);
    }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 35px rgba(107, 76, 138, 0.18);
    }
    .cat.active { background: #A78BFA; color: #382445; }
    .round { border-radius: 999px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.9rem;
      border-radius: 9999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: #f2eaff;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.68rem;
      font-weight: 700;
    }
    a:focus-visible, button:focus-visible {
      outline: 3px solid #A78BFA;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <nav class="nav fixed top-0 inset-x-0 z-50 text-white">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <a href="/" class="tracking-[.18em] font-bold">ABHINAYA <span class="text-[#A78BFA]">STORE</span></a>
        <a href="/" class="block text-xs text-white/60 mt-1">← Abhinaya Group</a>
      </div>
      <div id="cats" class="hidden md:flex gap-2"></div>
      <button id="menu" class="md:hidden text-[#A78BFA] text-xl"><i class="fas fa-bars"></i></button>
    </div>
    <div id="mobile" class="hidden px-6 pb-4"></div>
  </nav>

  <main>
    <section class="hero pt-36 pb-20 px-6 text-white">
      <div class="max-w-5xl mx-auto">
        <span class="badge">The finishing touch</span>
        <h1 class="text-5xl md:text-7xl mt-5 mb-5 leading-tight">Gaya yang terasa personal.</h1>
        <p class="text-white/75 max-w-xl leading-relaxed text-lg">
          Aksesori pilihan untuk melengkapi setiap versi dirimu—curated, effortless, dan selalu relevan.
        </p>
      </div>
    </section>

    <section class="max-w-7xl mx-auto px-6 py-16">
      <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <p class="col-span-full text-center text-[#6B4C8A]">Memuat koleksi...</p>
      </div>
    </section>
  </main>

  <footer class="bg-[#4A285F] text-white/60 text-center py-10 text-sm">
    © 2026 Abhinaya Store · <a href="/" class="text-[#A78BFA]">Abhinaya Group</a>
  </footer>

  <script>
    const categories = ['all', 'jam-tangan', 'kalung', 'gelang', 'cincin'];
    const labels = { all: 'Semua', 'jam-tangan': 'Jam Tangan', kalung: 'Kalung', gelang: 'Gelang', cincin: 'Cincin' };
    let products = [], active = 'all';
    const q = encodeURIComponent('*[_type == "storeProduct" && inStock == true]{_id,name,category,price,description,"imageUrl":image.asset->url}');
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));

    function buttons() {
      document.querySelectorAll('.cat').forEach((b) => {
        b.onclick = () => {
          active = b.dataset.c;
          document.querySelectorAll('.cat').forEach((x) => x.classList.toggle('active', x.dataset.c === active));
          render();
        };
      });
    }

    function nav(el) {
      el.innerHTML = categories.map((c) => `
        <button data-c="${c}" class="cat ${c === active ? 'active' : ''} px-4 py-2 round text-sm text-white/80">
          ${labels[c]}
        </button>
      `).join('');
      buttons();
    }

    nav(document.getElementById('cats'));
    nav(document.getElementById('mobile'));
    document.getElementById('menu').onclick = () => document.getElementById('mobile').classList.toggle('hidden');

    function render() {
      const list = active === 'all' ? products : products.filter((p) => p.category === active);
      document.getElementById('grid').innerHTML = list.length ? list.map((p) => `
        <article class="card group">
          <div class="h-56 bg-[#F3E8FF] p-5">
            <img src="${esc(p.imageUrl || 'https://via.placeholder.com/400?text=Product')}" alt="${esc(p.name)}" class="w-full h-full object-cover rounded-xl transition duration-500 group-hover:scale-105">
          </div>
          <div class="p-5">
            <span class="text-xs uppercase tracking-widest text-[#6B4C8A] font-bold">${esc(labels[p.category] || p.category)}</span>
            <h2 class="text-xl mt-2">${esc(p.name)}</h2>
            <p class="text-sm text-slate-500 mt-2 leading-relaxed">${esc(p.description)}</p>
            <div class="flex justify-between items-center mt-5">
              <b class="text-[#6B4C8A]">Rp ${Number(p.price || 0).toLocaleString('id-ID')}</b>
              <a class="bg-[#6B4C8A] text-white px-4 py-2 round text-sm hover:bg-[#A78BFA] transition" href="https://wa.me/6283193216920?text=${encodeURIComponent('Halo Abhinaya Store, saya tertarik dengan ' + p.name)}" target="_blank">Pilih</a>
            </div>
          </div>
        </article>
      `).join('') : '<p class="col-span-full text-center text-slate-500 py-12">Belum ada produk di kategori ini.</p>';
    }

    fetch('https://mwiphyyy.api.sanity.io/v2022-03-07/data/query/production?query=' + q)
      .then((r) => r.json())
      .then(({ result = [] }) => {
        products = result;
        render();
      })
      .catch(() => {
        document.getElementById('grid').innerHTML = '<p class="col-span-full text-center text-red-600">Gagal memuat produk.</p>';
      });
  </script>
</body>
</html>
