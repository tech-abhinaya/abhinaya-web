<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lucky Cheese | Fun Food & Drinks</title>
  <meta name="description" content="Makanan, snack, dan minuman kekinian Lucky Cheese.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --violet: #6D28D9;
      --purple: #9333EA;
      --lilac: #D8B4FE;
      --pink: #F5D0FE;
      --ink: #35115f;
      --paper: #FCF9FF;
      --line: rgba(109,40,217,0.12);
    }
    * { box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Nunito, sans-serif;
    }
    h1, h2, h3 { font-family: Fredoka, sans-serif; }
    .nav { background: rgba(109,40,217,.95); backdrop-filter: blur(16px); }
    .hero {
      background: radial-gradient(circle at 18% 18%, rgba(245,208,254,.38), transparent 25%), linear-gradient(135deg, #6D28D9, #9333EA 60%, #C026D3);
    }
    .card {
      background: white;
      border: 2px solid #F5D0FE;
      border-radius: 28px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: rotate(-1deg) translateY(-6px);
      box-shadow: 0 18px 0 #D8B4FE;
    }
    .cat.active { background: #F5D0FE; color: #6D28D9; }
    .round { border-radius: 999px; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1rem;
      border-radius: 9999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 800;
      color: #fef2ff;
    }
    a:focus-visible, button:focus-visible {
      outline: 3px solid #F5D0FE;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <nav class="nav fixed top-0 inset-x-0 z-50 text-white">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <a href="/" class="font-extrabold tracking-wider">LUCKY <span class="text-[#F5D0FE]">CHEESE</span></a>
        <a href="/" class="block text-xs text-white/70 mt-1">← Abhinaya Group</a>
      </div>
      <div id="cats" class="hidden md:flex gap-2"></div>
      <button id="menu" class="md:hidden text-[#F5D0FE] text-xl"><i class="fas fa-bars"></i></button>
    </div>
    <div id="mobile" class="hidden px-6 pb-4"></div>
  </nav>

  <main>
    <section class="hero pt-36 pb-20 px-6 text-white">
      <div class="max-w-5xl mx-auto">
        <span class="badge">Cheesy. Happy. Lucky.</span>
        <h1 class="text-5xl md:text-7xl mt-7 mb-5 leading-tight">Gurihnya keju, bikin nagih!</h1>
        <p class="text-white/85 max-w-xl text-lg leading-relaxed">Camilan seru, minuman segar, dan mood baik dalam satu gigitan.</p>
        <a href="#menu-list" class="inline-block bg-[#F5D0FE] text-[#6D28D9] font-extrabold px-7 py-3 round mt-8 shadow-[0_12px_30px_rgba(245,208,254,0.5)]">Lihat menu ↓</a>
      </div>
    </section>

    <section id="menu-list" class="max-w-7xl mx-auto px-6 py-16">
      <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-7">
        <p class="col-span-full text-center text-[#6D28D9]">Memuat menu...</p>
      </div>
    </section>
  </main>

  <footer class="bg-[#6D28D9] text-white text-center py-10">© 2026 Lucky Cheese · <a href="/" class="text-[#F5D0FE]">Abhinaya Group</a></footer>

  <script>
    const categories = ['all', 'makanan', 'snack', 'minuman'];
    const labels = { all: 'Semua', makanan: 'Makanan', snack: 'Snack', minuman: 'Minuman' };
    let products = [], active = 'all';
    const q = encodeURIComponent('*[_type == "cheeseMenu" && available == true]{_id,name,category,price,description,"imageUrl":image.asset->url}');
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));

    function nav(el) {
      el.innerHTML = categories.map((c) => `
        <button data-c="${c}" class="cat ${c === active ? 'active' : ''} px-4 py-2 round text-sm font-bold text-white/90">
          ${labels[c]}
        </button>
      `).join('');
      el.querySelectorAll('.cat').forEach((b) => {
        b.onclick = () => {
          active = b.dataset.c;
          document.querySelectorAll('.cat').forEach((x) => x.classList.toggle('active', x.dataset.c === active));
          render();
        };
      });
    }

    nav(document.getElementById('cats'));
    nav(document.getElementById('mobile'));
    document.getElementById('menu').onclick = () => document.getElementById('mobile').classList.toggle('hidden');

    function render() {
      const list = active === 'all' ? products : products.filter((p) => p.category === active);
      document.getElementById('grid').innerHTML = list.length ? list.map((p) => `
        <article class="card overflow-hidden group">
          <div class="h-52 bg-[#F5D0FE] p-4">
            <img src="${esc(p.imageUrl || 'https://via.placeholder.com/400?text=Yum')}" alt="${esc(p.name)}" class="w-full h-full object-cover rounded-2xl transition duration-500 group-hover:scale-105">
          </div>
          <div class="p-5">
            <span class="text-xs uppercase tracking-widest text-[#9333EA] font-extrabold">${esc(labels[p.category] || p.category)}</span>
            <h2 class="text-xl mt-2">${esc(p.name)}</h2>
            <p class="text-sm text-slate-500 mt-2 leading-relaxed">${esc(p.description)}</p>
            <div class="flex justify-between items-center mt-5">
              <b class="text-[#6D28D9]">Rp ${Number(p.price || 0).toLocaleString('id-ID')}</b>
              <a class="bg-[#6D28D9] text-white px-4 py-2 round text-sm font-bold hover:bg-[#9333EA] transition" href="https://wa.me/6283193216920?text=${encodeURIComponent('Halo Lucky Cheese, saya mau pesan ' + p.name)}" target="_blank">Pesan</a>
            </div>
          </div>
        </article>
      `).join('') : '<p class="col-span-full text-center text-slate-500 py-12">Belum ada menu di kategori ini.</p>';
    }

    fetch('https://mwiphyyy.api.sanity.io/v2022-03-07/data/query/production?query=' + q)
      .then((r) => r.json())
      .then(({ result = [] }) => {
        products = result;
        render();
      })
      .catch(() => {
        document.getElementById('grid').innerHTML = '<p class="col-span-full text-center text-red-600">Gagal memuat menu.</p>';
      });
  </script>

</body>
</html>
