<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- OG Tags -->

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Abhinaya Parfume">
  <meta name="twitter:description" content="Koleksi parfum pria, wanita, dan unisex.">
  <meta name="twitter:image" content="https://abhinaya-web.pages.dev/og-parfume.jpg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --night: #24112F;
      --violet: #5B2A68;
      --mauve: #B276B2;
      --rose: #F5EAF7;
      --ink: #32183c;
      --line: rgba(91,42,104,0.12);
    }
    * { box-sizing: border-box; }
    body {
      background: #FCF7FD;
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
    }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .nav { background: rgba(36,17,47,.94); backdrop-filter: blur(16px); }
    .hero {
      background: radial-gradient(circle at 75% 30%, rgba(178,118,178,.35), transparent 30%), linear-gradient(135deg, #24112F, #5B2A68 60%, #32183c);
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(91,42,104,0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 40px rgba(91,42,104,0.15);
    }
    .cat.active { background: #B276B2; color: #24112F; }
    .round { border-radius: 999px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 0.95rem;
      border-radius: 9999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.68rem;
      font-weight: 700;
      color: #f3dff5;
    }
    a:focus-visible, button:focus-visible {
      outline: 3px solid #B276B2;
      outline-offset: 3px;
    }

    /* Scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0% { background-position: -468px 0; }
      100% { background-position: 468px 0; }
    }
    .skeleton {
      background: linear-gradient(to right, #f0f0f0 8%, #e8e8e8 18%, #f0f0f0 33%);
      background-size: 800px 100%;
      animation: shimmer 1.4s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <nav class="nav fixed top-0 inset-x-0 z-50 text-white">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <a href="/" class="tracking-[.18em] font-bold">ABHINAYA <span class="text-[#B276B2]">PARFUME</span></a>
        <a href="/" class="block text-xs text-white/55 mt-1">← Abhinaya Group</a>
      </div>
      <div id="cats" class="hidden md:flex gap-2"></div>
      <button id="menu" class="md:hidden text-[#B276B2] text-xl" aria-label="Buka menu" aria-expanded="false">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    <div id="mobile" class="hidden px-6 pb-4"></div>
  </nav>

  <main>
    <section class="hero pt-36 pb-24 px-6 text-white">
      <div class="max-w-5xl mx-auto">
        <span class="badge">Scent stories</span>
        <h1 class="text-5xl md:text-7xl mt-5 mb-5 leading-tight">Aroma yang membekas.</h1>
        <p class="text-white/70 max-w-xl leading-relaxed text-lg">
          Temukan signature scent yang terasa intim, elegan, dan sepenuhnya milikmu.
        </p>
      </div>
    </section>

    <section class="max-w-7xl mx-auto px-6 py-20">
      <div class="flex justify-between items-end mb-10">
        <div>
          <span class="text-[#B276B2] uppercase tracking-[.25em] text-xs font-bold">The collection</span>
          <h2 class="text-4xl mt-2">Kurasi wewangian</h2>
        </div>
      </div>
      <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-7">
        <p class="col-span-full text-center text-[#5B2A68]">Memuat koleksi...</p>
      </div>
    </section>
  </main>

  <footer class="bg-[#24112F] text-white/60 text-center py-10 text-sm">
    © 2026 Abhinaya Parfume · <a href="/" class="text-[#B276B2]">Abhinaya Group</a>
  </footer>

  <script>
    // Skeleton component
    function skeletonCard() {
      return `
        <div class="card overflow-hidden animate-pulse">
          <div class="h-60 skeleton"></div>
          <div class="p-6 space-y-3">
            <div class="h-3 skeleton rounded w-1/3"></div>
            <div class="h-5 skeleton rounded w-3/4"></div>
            <div class="h-3 skeleton rounded w-full"></div>
            <div class="h-3 skeleton rounded w-5/6"></div>
            <div class="flex justify-between items-center pt-3">
              <div class="h-5 skeleton rounded w-1/3"></div>
              <div class="h-8 skeleton rounded-full w-20"></div>
            </div>
          </div>
        </div>
      `;
    }

    // Inject skeleton dulu
    document.getElementById('grid').innerHTML = Array(4).fill(skeletonCard()).join('');

    const categories = ['all', 'pria', 'wanita', 'unisex'];
    const labels = { all: 'Semua', pria: 'Pria', wanita: 'Wanita', unisex: 'Unisex' };
    let products = [], active = 'all';
    const q = encodeURIComponent('*[_type == "parfumeProduct" && inStock == true]{_id,name,category,size,price,notes,"imageUrl":image.asset->url}');
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));

    // Scroll reveal
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    const observeReveals = () => {
      document.querySelectorAll('.reveal:not(.visible)').forEach((el) => revealObserver.observe(el));
    };

    function nav(el) {
      el.innerHTML = categories.map((c) => `
        <button data-c="${c}" class="cat ${c === active ? 'active' : ''} px-4 py-2 round text-sm text-white/80">
          ${labels[c]}
        </button>
      `).join('');
      el.querySelectorAll('.cat').forEach((b) => {
        b.onclick = () => {
          active = b.dataset.c;
          document.querySelectorAll('.cat').forEach((x) => x.classList.toggle('active', x.dataset.c === active));
          render();
        };
      });
    }

    nav(document.getElementById('cats'));
    nav(document.getElementById('mobile'));
    document.getElementById('menu').onclick = (e) => {
      const mobile = document.getElementById('mobile');
      const isHidden = mobile.classList.toggle('hidden');
      e.currentTarget.setAttribute('aria-expanded', String(!isHidden));
    };

    function render() {
      const list = active === 'all' ? products : products.filter((p) => p.category === active);
      document.getElementById('grid').innerHTML = list.length ? list.map((p, i) => `
        <article class="card overflow-hidden group reveal" style="transition-delay:${i * 60}ms">
          <div class="h-60 bg-[#F5EAF7] p-6">
            <img src="${esc(p.imageUrl || 'https://via.placeholder.com/400?text=Fragrance')}" alt="${esc(p.name)}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105" loading="lazy">
          </div>
          <div class="p-6">
            <span class="text-xs uppercase tracking-widest text-[#B276B2] font-bold">
              ${esc(labels[p.category] || p.category)}${p.size ? ' · ' + esc(p.size) + ' ml' : ''}
            </span>
            <h2 class="text-xl mt-2">${esc(p.name)}</h2>
            <p class="text-sm text-slate-500 mt-2 leading-relaxed">${esc(p.notes)}</p>
            <div class="flex justify-between items-center mt-5">
              <b class="text-[#5B2A68]">Rp ${Number(p.price || 0).toLocaleString('id-ID')}</b>
              <a class="bg-[#5B2A68] text-white px-4 py-2 round text-sm hover:bg-[#B276B2] transition" href="https://wa.me/6283193216920?text=${encodeURIComponent('Halo Abhinaya Parfume, saya tertarik dengan ' + p.name)}" target="_blank">Pesan</a>
            </div>
          </div>
        </article>
      `).join('') : '<p class="col-span-full text-center text-slate-500 py-12">Belum ada parfum di kategori ini.</p>';

      requestAnimationFrame(observeReveals);
    }

    fetch('https://mwiphyyy.api.sanity.io/v2022-03-07/data/query/production?query=' + q)
      .then((r) => r.json())
      .then(({ result = [] }) => {
        products = result;
        render();
      })
      .catch((err) => {
        console.error('Fetch error:', err);
        document.getElementById('grid').innerHTML = `
          <div class="col-span-full text-center py-16">
            <div class="w-16 h-16 mx-auto rounded-full bg-red-50 flex items-center justify-center mb-4">
              <i class="fas fa-exclamation-triangle text-2xl text-red-500"></i>
            </div>
            <h3 class="text-xl text-[#24112F] mb-2">Gagal memuat produk</h3>
            <p class="text-slate-500 text-sm mb-5">Silakan coba lagi atau hubungi kami langsung.</p>
            <button onclick="location.reload()" class="bg-[#5B2A68] text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-[#B276B2] transition">
              Coba Lagi
            </button>
          </div>
        `;
      });
  </script>
