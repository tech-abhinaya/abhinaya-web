<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abhinaya Parfume | Boutique Fragrance</title><meta name="description" content="Koleksi parfum pria, wanita, dan unisex Abhinaya Parfume."><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>:root{--night:#24112F;--violet:#5B2A68;--mauve:#B276B2;--rose:#F5EAF7;--ink:#32183c}*{box-sizing:border-box}body{background:#FCF7FD;color:var(--ink);font-family:'DM Sans',sans-serif}h1,h2,h3{font-family:'Playfair Display',serif}.nav{background:rgba(36,17,47,.94);backdrop-filter:blur(16px)}.hero{background:radial-gradient(circle at 75% 30%,#B276B255,transparent 30%),linear-gradient(135deg,#24112F,#5B2A68 60%,#32183c)}.card{background:#fff;border:1px solid #ead7ed;border-radius:8px;box-shadow:0 8px 28px #5B2A6812;transition:.3s}.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px #5B2A6826}.cat.active{background:#B276B2;color:#24112F}.round{border-radius:999px}a:focus-visible,button:focus-visible{outline:3px solid #B276B2;outline-offset:3px}</style></head><body><nav class="nav fixed top-0 inset-x-0 z-50 text-white"><div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"><div><a href="/" class="tracking-[.18em] font-bold">ABHINAYA <span class="text-[#B276B2]">PARFUME</span></a><a href="/" class="block text-xs text-white/55 mt-1">← Abhinaya Group</a></div><div id="cats" class="hidden md:flex gap-2"></div><button id="menu" class="md:hidden text-[#B276B2] text-xl"><i class="fas fa-bars"></i></button></div><div id="mobile" class="hidden px-6 pb-4"></div></nav><main><section class="hero pt-36 pb-24 px-6 text-white"><div class="max-w-5xl mx-auto"><span class="text-[#EBCDEB] uppercase tracking-[.3em] text-xs font-bold">Scent stories</span><h1 class="text-5xl md:text-7xl mt-5 mb-5">Aroma yang membekas.</h1><p class="text-white/70 max-w-xl leading-relaxed">Temukan signature scent yang terasa intim, elegan, dan sepenuhnya milikmu.</p></div></section><section class="max-w-7xl mx-auto px-6 py-20"><div class="flex justify-between items-end mb-10"><div><span class="text-[#B276B2] uppercase tracking-[.25em] text-xs font-bold">The collection</span><h2 class="text-4xl mt-2">Kurasi wewangian</h2></div></div><div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-7"><p class="col-span-full text-center text-[#5B2A68]">Memuat koleksi...</p></div></section></main><footer class="bg-[#24112F] text-white/60 text-center py-10 text-sm">© 2026 Abhinaya Parfume · <a href="/" class="text-[#B276B2]">Abhinaya Group</a></footer><script>const categories=['all','pria','wanita','unisex'],labels={all:'Semua',pria:'Pria',wanita:'Wanita',unisex:'Unisex'};let products=[],active='all';const q=encodeURIComponent('*[_type == "parfumeProduct" && inStock == true]{_id,name,category,size,price,notes,"imageUrl":image.asset->url}');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function nav(el){el.innerHTML=categories.map(c=>`<button data-c="${c}" class="cat ${c===active?'active':''} px-4 py-2 round text-sm text-white/80">${labels[c]}</button>`).join('');el.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{active=b.dataset.c;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.c===active));render()})}nav(document.getElementById('cats'));nav(document.getElementById('mobile'));document.getElementById('menu').onclick=()=>document.getElementById('mobile').classList.toggle('hidden');function render(){let list=active==='all'?products:products.filter(p=>p.category===active);document.getElementById('grid').innerHTML=list.length?list.map(p=>`<article class="card overflow-hidden"><div class="h-60 bg-[#F5EAF7] p-6"><img src="${esc(p.imageUrl||'https://via.placeholder.com/400?text=Fragrance')}" alt="${esc(p.name)}" class="w-full h-full object-cover"></div><div class="p-6"><span class="text-xs uppercase tracking-widest text-[#B276B2] font-bold">${esc(labels[p.category]||p.category)} · ${esc(p.size? p.size+' ml':'')}</span><h2 class="text-xl mt-2">${esc(p.name)}</h2><p class="text-sm text-slate-500 mt-2">${esc(p.notes)}</p><div class="flex justify-between items-center mt-5"><b class="text-[#5B2A68]">Rp ${Number(p.price||0).toLocaleString('id-ID')}</b><a class="bg-[#5B2A68] text-white px-4 py-2 round text-sm hover:bg-[#B276B2]" href="https://wa.me/6283193216920?text=${encodeURIComponent('Halo Abhinaya Parfume, saya tertarik dengan '+p.name)}" target="_blank">Pesan</a></div></div></article>`).join(''):'<p class="col-span-full text-center text-slate-500 py-12">Belum ada parfum di kategori ini.</p>'}fetch('https://mwiphyyy.api.sanity.io/v2022-03-07/data/query/production?query='+q).then(r=>r.json()).then(({result=[]})=>{products=result;render()}).catch(()=>document.getElementById('grid').innerHTML='<p class="col-span-full text-center text-red-600">Gagal memuat produk.</p>');</script></body></html>
