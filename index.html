<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhinaya Group | Ekosistem Retail & Hiburan</title>
  
  <!-- Memanggil Tailwind CSS untuk styling cepat -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Memanggil Font Playfair Display (Corporate) & Plus Jakarta Sans (Modern) -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F7F3F9; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="text-[#4A2C4D]">

  <!-- Bagian Header (Kepala Web) -->
  <header class="bg-[#4A2C4D] text-[#F7F3F9] py-16 text-center shadow-lg">
    <h1 class="text-4xl md:text-5xl font-bold mb-4 text-[#C9A96A]">Abhinaya Group</h1>
    <p class="text-lg md:text-xl font-light text-[#C8A8D8] max-w-2xl mx-auto px-4">
      Mengelola ekosistem retail, hiburan keluarga, dan gaya hidup modern secara profesional.
    </p>
  </header>

  <!-- Bagian Utama Konten -->
  <main class="max-w-7xl mx-auto px-4 py-16">
    <div class="text-center mb-12">
      <h2 class="text-3xl font-bold mb-4">Pilar Bisnis Kami</h2>
      <div class="w-24 h-1 bg-[#8B5A8C] mx-auto rounded"></div>
    </div>

    <!-- INI WADAH KOSONGNYA: Tempat kartu bisnis bakal muncul -->
    <div id="business-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      <p class="text-center text-[#8B5A8C] col-span-full font-semibold animate-pulse">Memuat data dari server Sanity...</p>
    </div>
  </main>

  <!-- Bagian Footer (Bawah Web) -->
  <footer class="bg-white text-center py-8 border-t border-[#C8A8D8]">
    <p class="text-sm text-[#8B5A8C] font-medium">&copy; 2026 Abhinaya Group. All rights reserved.</p>
  </footer>

  <!-- Script Penarik Data dari Sanity CMS -->
  <script>
    const PROJECT_ID = 'mwiphyyy';
    const DATASET = 'production';
    const QUERY = encodeURIComponent('*[_type == "business"]{name, category, description, "imageUrl": image.asset->url}');
    const URL = `https://${PROJECT_ID}.api.sanity.io/v2022-03-07/data/query/${DATASET}?query=${QUERY}`;

    fetch(URL)
      .then(response => response.json())
      .then(({ result }) => {
        const container = document.getElementById('business-container');
        container.innerHTML = ''; // Menghapus teks "Memuat data..."
        
        // Membentuk kartu HTML untuk setiap data yang ada di Sanity
        result.forEach(item => {
          const card = `
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 border border-[#F7F3F9]">
              <img src="${item.imageUrl || 'https://via.placeholder.com/400x300?text=Belum+Ada+Foto'}" alt="${item.name}" class="w-full h-48 object-cover">
              <div class="p-6">
                <span class="text-xs font-bold text-[#8B5A8C] uppercase tracking-widest">${item.category}</span>
                <h3 class="text-2xl font-bold text-[#4A2C4D] mt-2 mb-3">${item.name}</h3>
                <p class="text-gray-600 text-sm leading-relaxed">${item.description}</p>
              </div>
            </div>
          `;
          container.innerHTML += card;
        });
      })
      .catch(error => {
        console.error("Error narik data:", error);
        document.getElementById('business-container').innerHTML = '<p class="text-red-500 text-center col-span-full">Gagal memuat data dari server.</p>';
      });
  </script>
</body>
</html>
